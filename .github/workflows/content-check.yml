name: Content Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check home page
        run: |
          set -e
          for s in "Junteng Liu" "Academic Background" "Research Experience" "Publications" "Skills" "Contact Information" "SynLogic" "C-Eval" "jliugi@connect.ust.hk" "Vicent0205"; do
            grep -Fq "$s" _site/index.html || { echo "Missing: $s"; exit 1; }
          done
          if grep -Fq "Your Name" _site/index.html; then echo "Template placeholder found"; exit 1; fi
          echo "Home page OK"
      - name: Check publications page
        run: |
          set -e
          for s in "SynLogic" "On the Perception Bottleneck of VLMs for Chart Understanding" "On the Universal Truthfulness Hyperplane Inside LLMs" "In-Context Sharpness as Alerts" "C-Eval" "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -Fq "$s" _site/publications/index.html || { echo "Missing: $s"; exit 1; }
          done
          echo "Publications page OK"
      - name: Check CV page
        run: |
          set -e
          for s in "Junteng Liu" "MINIMAX" "Shanghai AI Lab"; do
            grep -Fq "$s" _site/cv/index.html || { echo "Missing: $s"; exit 1; }
          done
          echo "CV page OK"
